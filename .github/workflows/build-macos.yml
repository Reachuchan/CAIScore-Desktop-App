name: Build macOS Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'caiscore_desktop_app.py'
      - 'caiscore_predict_cli.R'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Release CAIScore for macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          Rscript -e '
            if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager", repos="https://cloud.r-project.org")
            BiocManager::install(c("AUCell", "singscore", "GSVA", "rms", "survival", "matrixStats", "ggplot2", "data.table"), ask = FALSE, update = FALSE)
          '

      - name: Build macOS App Bundle with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "CAIScore" \
            --icon "assets/liver_icon.png" \
            --add-data "sample_data:sample_data" \
            --add-data "assets:assets" \
            --add-data "caiscore_predict_cli.R:." \
            caiscore_desktop_app.py

      - name: Ad-hoc Code Sign macOS App
        run: |
          echo "Signing CAIScore.app..."
          codesign --force --deep --sign - "dist/CAIScore.app"

      - name: Prepare macOS Distribution Package
        run: |
          mkdir -p CAIScore-v1.0.0-macOS
          cp -R "dist/CAIScore.app" CAIScore-v1.0.0-macOS/

          # Create 1-click Gatekeeper bypass launcher
          cat << 'EOF' > CAIScore-v1.0.0-macOS/Start_CAIScore_Mac.command
          #!/bin/bash
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          echo "=========================================================="
          echo "  CAIScore 桌面端临床辅助评估工具 - macOS 启动器"
          echo "=========================================================="
          echo "[1/2] 正在自动清除 macOS Gatekeeper 安全隔离属性..."
          xattr -cr "$DIR/CAIScore.app" 2>/dev/null
          echo "[2/2] 正在启动主界面..."
          open "$DIR/CAIScore.app"
          EOF

          chmod +x CAIScore-v1.0.0-macOS/Start_CAIScore_Mac.command

          # Create README instructions for Mac users
          cat << 'EOF' > CAIScore-v1.0.0-macOS/使用说明_Mac用户必读.txt
          ==========================================================
            CAIScore Desktop App (macOS 苹果电脑版使用指引)
          ==========================================================

          【推荐启动方式】
          双击运行同目录下的 `Start_CAIScore_Mac.command` 文件，
          脚本会自动清除 macOS 安全隔离标记并直接调起软件主界面。

          【常规启动方式】
          直接双击 `CAIScore.app`。
          若系统提示“无法打开，因为无法验证开发者”或“应用已损坏”：
          1. 右键点击 `CAIScore.app` -> 选择【打开】(Open)；
          2. 在弹出的对话框中再次点击【打开】即可正常运行（仅首次需要确认一次）。
          3. 或者在终端执行命令：
             xattr -cr /path/to/CAIScore.app

          【数据安全与隐私】
          本软件所有计算全流程在本地纯内存中完成，100% 离线单机运行，
          不上传任何患者病历或基因测序数据。
          ==========================================================
          EOF

          ditto -c -k --sequesterRsrc --keepParent CAIScore-v1.0.0-macOS CAIScore-v1.0.0-macOS.zip
          ls -lh CAIScore-v1.0.0-macOS.zip

      - name: Upload macOS Package to GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading CAIScore-v1.0.0-macOS.zip to Release v1.0.0..."
          gh release upload v1.0.0 CAIScore-v1.0.0-macOS.zip --clobber --repo ${{ github.repository }}
          echo "Upload complete!"
